version: '3'
services:
  qanary-component-qb-python-rulebasedquerybuilder: # for building from source
    # or use image: qanary/qanary-component-qb-python-rulebasedquerybuilder:latest
    image: qanary/qanary-component-qb-python-rulebasedquerybuilder:latest
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    container_name: $SERVICE_NAME_COMPONENT
    network_mode: host # usage of ports also possible
