name: Qanary Component Build Pipeline

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-java:
    runs-on: ubuntu-latest
    env:
      BABELFY_API_KEY: ${{ secrets.BABELFY_API_KEY }}
      CHATGPT_API_KEY: ${{ secrets.CHATGPT_API_KEY }}
      DANDELION_API_KEY: ${{ secrets.DANDELION_API_KEY }}
      MEANINGCLOUD_API_KEY: ${{ secrets.MEANINGCLOUD_API_KEY }}
      TAGME_API_KEY: ${{ secrets.TAGME_API_KEY }}
      TEXTRAZOR_API_KEY: ${{ secrets.TEXTRAZOR_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Configure java
        uses: actions/setup-java@v5
        with:
          distribution: "corretto"
          java-version: "25"
      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: actions/checkout@v7
      - name: Build and push Java components
        run: bash -c ./service_config/build_images.sh
      - name: Init update
        uses: WSE-research/docker-service-updater@v0.2.1
        with:
          api_key: ${{ secrets.API_KEY }}
          updater_host: ${{ secrets.UPDATER_HOST }}
  build-python:
    runs-on: ubuntu-latest
    steps:
      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: actions/checkout@v7
      - name: Build and push Python components
        run: bash -c ./service_config/build_python_images.sh
      - name: Init update
        uses: WSE-research/docker-service-updater@v0.2.1
        with:
          api_key: ${{ secrets.API_KEY }}
          updater_host: ${{ secrets.UPDATER_HOST }}
  # A green build step does not mean the change is live: the image build published
  # nothing for months while every run reported success, and LD-Shuyo crash-looped on
  # the server unnoticed. This job asks the deployment itself whether it now runs what
  # was just built. It cannot block the rollout (that already happened above) - it
  # reports whether the rollout worked.
  verify-deployment:
    runs-on: ubuntu-latest
    needs: [build-java, build-python]
    permissions:
      contents: read
      actions: read # to read the start time of this workflow run
    steps:
      - uses: actions/checkout@v7
      - name: Determine when the deployment was triggered
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          started=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" --jq .created_at)
          echo "started_at=${started}" >> "$GITHUB_OUTPUT"
          echo "deployment triggered by the run started at ${started}"
      - name: Verify that the deployment runs the new components
        run: |
          python3 service_config/verify_deployment.py \
            --since "${{ steps.deployment.outputs.started_at }}" \
            --timeout-minutes 15
